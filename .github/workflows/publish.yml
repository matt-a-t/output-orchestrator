name: Publish

# Pushing a v* tag (`npm version patch && git push --follow-tags`) publishes that version to npm.
# Uses npm trusted publishing (OIDC): no npm token is stored, and provenance is added automatically.
# The publish job waits for approval on the npm-publish environment, and only it can mint the OIDC
# token. It installs with --ignore-scripts so no dependency's lifecycle scripts run while it can.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Waits for a reviewer to approve the run, and only v* tags may deploy to it (both set in the repo's settings).
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 24 ships.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never restore a cache another run could have written.
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      # --ignore-scripts skips prepublishOnly, which would only rebuild what was just built.
      - run: npm publish --ignore-scripts
