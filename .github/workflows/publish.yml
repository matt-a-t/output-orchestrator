name: Publish

# Pushing a v* tag (`npm version patch && git push --follow-tags`) publishes that version to npm.
# Uses npm trusted publishing (OIDC): no npm token is stored, and provenance is added automatically.
on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Waits for a reviewer to approve the run, and only v* tags may deploy to it (both set in the repo's settings).
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 24 ships.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # prepublishOnly does a clean build first.
      - run: npm publish
